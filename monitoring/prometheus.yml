global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: "log-platform-services"
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    # Prometheus sends the internal token so backend services allow scraping
    headers:
      X-Internal-Token: ${PROMETHEUS_SCRAPE_TOKEN:dev-internal-token}
    static_configs:
      - targets:
          - identity-service:8081
          - api-gateway:8080
          - ingestion-service:8083
          - processing-service:8084
          - query-service:8085
          - alert-service:8086
          - notification-service:8086

# Optional: add redis-exporter and mysqld-exporter for detailed infra metrics
# - job_name: "redis"
