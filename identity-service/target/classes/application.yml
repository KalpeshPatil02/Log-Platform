server:
  port: 8081

spring:
  application:
    name: identity-service

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/identity_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${IDENTITY_DB_PASSWORD:Root@123}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

  data:
    web:
      pageable:
        max-page-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

identity:
  jwt:
    issuer: http://localhost:8081
    access-token-ttl: 15m
    private-key-path: ${JWT_PRIVATE_KEY_PATH:../secrets/private.pem}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:../secrets/public.pem}

  internal-token: ${INTERNAL_TOKEN:dev-internal-token}

  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:admin@platform.local}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:Root123}

logging:
  level:
    org.springframework.security: INFO
    org.flywaydb: INFO
    org.hibernate.SQL: INFO
