server:
  port: ${PROCESSING_SERVER_PORT:8084}
spring:
  application:
    name: processing-service
  datasource:
    url: ${PROCESSING_DB_URL:jdbc:mysql://mysql:3306/logs_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${PROCESSING_DB_USERNAME:logs_app}
    password: ${PROCESSING_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
app:
  processing:
    raw-stream: ${LOGS_RAW_STREAM:logs.raw}
    processed-stream: ${LOGS_PROCESSED_STREAM:logs.processed}
    dead-letter-stream: ${LOGS_DLQ_STREAM:logs.dlq}
    group: ${PROCESSING_CONSUMER_GROUP:processing-group}
    consumer-name: ${PROCESSING_CONSUMER_NAME:processing-1}
    batch-size: ${PROCESSING_BATCH_SIZE:20}
    pending-idle-millis: ${PROCESSING_PENDING_IDLE_MS:90000}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
