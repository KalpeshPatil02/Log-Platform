server:
  port: ${ALERT_SERVER_PORT:8086}
  shutdown: graceful
spring:
  application:
    name: alert-service
  datasource:
    url: ${ALERT_DB_URL:jdbc:mysql://mysql:3306/alert_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${ALERT_DB_USERNAME:alert_svc}
    password: ${ALERT_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  lifecycle:
    timeout-per-shutdown-phase: 30s
app:
  alert:
    processed-stream: ${LOGS_PROCESSED_STREAM:logs.processed}
    dead-letter-stream: ${LOGS_DLQ_STREAM:logs.dlq}
    consumer-group: ${ALERT_CONSUMER_GROUP:alert-service}
    consumer-name: ${ALERT_CONSUMER_NAME:alert-1}
    poll-delay-ms: ${ALERT_POLL_DELAY_MS:1000}
    window-key-prefix: "alert:window:"
    cooldown-seconds: ${ALERT_COOLDOWN_SECONDS:300}
    notification-stream: ${NOTIFICATIONS_OUT_STREAM:notifications.out}
    pending-idle-ms: ${ALERT_PENDING_IDLE_MS:60000}   # a failed event is retried after this long
    max-deliveries: ${ALERT_MAX_DELIVERIES:5}          # then it goes to the DLQ
    recovery-delay-ms: ${ALERT_RECOVERY_DELAY_MS:15000}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
