server:
  port: 8085
spring:
  application:
    name: query-service
  datasource:
    url: ${QUERY_DB_URL:jdbc:mysql://127.0.0.1:3307/logs_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${QUERY_DB_USER:query_svc}
    password: ${QUERY_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
